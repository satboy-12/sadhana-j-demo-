<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"></head><body class="bg-background font-body-md text-on-background"><main class="w-full bg-background min-h-screen flex items-center justify-center p-gutter"><div class="flex flex-col w-full items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
<!-- Subtle background decorative gradient blob -->
<div class="absolute w-96 h-96 rounded-full bg-primary-fixed/30 blur-3xl -top-20 -left-20 pointer-events-none"></div>
<div class="absolute w-96 h-96 rounded-full bg-secondary-fixed/30 blur-3xl -bottom-20 -right-20 pointer-events-none"></div>
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-xl p-8 sm:p-10 relative z-10 flex flex-col gap-space-lg">
<!-- Brand / Header -->
<div class="flex flex-col items-center text-center gap-space-xs">
<div class="px-3 py-1.5 rounded-xl bg-[#092820] border border-[#C5A66B]/40 mb-space-sm shadow-sm border border-primary/20 flex items-center justify-center"><img src="/assets/brand/her-health-journey-logo.png" alt="Her Health Journey Logo" class="h-12 w-auto object-contain"></div>
<h1 class="font-headline-lg text-headline-lg text-on-background">Her Health Journey</h1>
<p class="font-body-md text-on-surface-variant">Create your secure, private health account</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-space-md" id="registrationForm" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-on-surface-variant" for="fullName">Full Name</label>
<div class="flex items-center bg-surface-container-low rounded-xl px-4 py-3 gap-space-sm focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-outline">person</span>
<input class="w-full bg-transparent outline-none font-body-md text-on-background placeholder:text-outline/60" id="fullName" placeholder="Dr. Jane Doe" required="" type="text">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-on-surface-variant" for="email">Email Address</label>
<div class="flex items-center bg-surface-container-low rounded-xl px-4 py-3 gap-space-sm focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-outline">mail</span>
<input class="w-full bg-transparent outline-none font-body-md text-on-background placeholder:text-outline/60" id="email" placeholder="jane.doe@example.com" required="" type="email">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-on-surface-variant" for="password">Password</label>
<div class="flex items-center bg-surface-container-low rounded-xl px-4 py-3 gap-space-sm focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-outline">lock</span>
<input class="w-full bg-transparent outline-none font-body-md text-on-background placeholder:text-outline/60" id="password" oninput="checkPasswordStrength(this.value)" placeholder="••••••••••••" required="" type="password">
<button class="text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="flex flex-col gap-1 mt-1">
<div class="flex gap-1 h-1 w-full bg-surface-container rounded-full overflow-hidden">
<div class="w-1/4 bg-surface-container-high transition-all" id="strengthBar1"></div>
<div class="w-1/4 bg-surface-container-high transition-all" id="strengthBar2"></div>
<div class="w-1/4 bg-surface-container-high transition-all" id="strengthBar3"></div>
<div class="w-1/4 bg-surface-container-high transition-all" id="strengthBar4"></div>
</div>
<span class="font-body-sm text-outline" id="strengthText">Use 8+ characters with a mix of letters, numbers &amp; symbols</span>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-on-surface-variant" for="confirmPassword">Confirm Password</label>
<div class="flex items-center bg-surface-container-low rounded-xl px-4 py-3 gap-space-sm focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-outline">lock_reset</span>
<input class="w-full bg-transparent outline-none font-body-md text-on-background placeholder:text-outline/60" id="confirmPassword" oninput="checkPasswordMatch()" placeholder="••••••••••••" required="" type="password">
<span class="material-symbols-outlined text-outline text-xl hidden" id="matchIcon">check_circle</span>
</div>
<span class="font-body-sm text-error hidden" id="matchError">Passwords do not match</span>
</div>
<!-- Privacy Notice Checkbox -->
<div class="flex items-start gap-space-sm mt-space-xs">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-pointer" id="privacy" required="" type="checkbox">
</div>
<label class="font-body-sm text-on-surface-variant cursor-pointer select-none" for="privacy">
          I agree to the <a class="text-primary hover:underline font-label-sm" href="login.html">Privacy Policy</a> and consent to secure health data processing under HIPAA compliance.
        </label>
</div>
<!-- Submit Button -->
<button class="w-full mt-space-sm py-3 px-6 rounded-xl bg-primary text-on-primary font-label-md hover:bg-primary-container shadow-md transition-all flex items-center justify-center gap-space-sm cursor-pointer" type="button" onclick="window.location.href='login.html'">
<span>Create Account</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Footer / Login Link -->
<div class="flex items-center justify-center gap-1 pt-space-sm text-center">
<span class="font-body-sm text-on-surface-variant">Already have an account?</span>
<a class="font-label-md text-primary hover:underline" href="login.html">Log in</a>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function checkPasswordStrength(password) {
    const bar1 = document.getElementById('strengthBar1');
    const bar2 = document.getElementById('strengthBar2');
    const bar3 = document.getElementById('strengthBar3');
    const bar4 = document.getElementById('strengthBar4');
    const text = document.getElementById('strengthText');

    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    const bars = [bar1, bar2, bar3, bar4];
    bars.forEach((bar, idx) => {
      if (idx < score) {
        bar.className = 'w-1/4 bg-tertiary transition-all';
      } else {
        bar.className = 'w-1/4 bg-surface-container-high transition-all';
      }
    });

    if (password.length === 0) {
      text.textContent = 'Use 8+ characters with a mix of letters, numbers & symbols';
      text.className = 'font-body-sm text-outline';
    } else if (score < 2) {
      text.textContent = 'Weak password';
      text.className = 'font-body-sm text-error';
    } else if (score < 4) {
      text.textContent = 'Moderate password strength';
      text.className = 'font-body-sm text-secondary';
    } else {
      text.textContent = 'Strong password';
      text.className = 'font-body-sm text-tertiary';
    }
    checkPasswordMatch();
  }

  function checkPasswordMatch() {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('confirmPassword').value;
    const matchIcon = document.getElementById('matchIcon');
    const matchError = document.getElementById('matchError');

    if (p2.length > 0) {
      if (p1 === p2) {
        matchIcon.classList.remove('hidden');
        matchIcon.className = 'material-symbols-outlined text-tertiary text-xl';
        matchIcon.textContent = 'check_circle';
        matchError.classList.add('hidden');
      } else {
        matchIcon.classList.remove('hidden');
        matchIcon.className = 'material-symbols-outlined text-error text-xl';
        matchIcon.textContent = 'error';
        matchError.classList.remove('hidden');
      }
    } else {
      matchIcon.classList.add('hidden');
      matchError.classList.add('hidden');
    }
  }
</script></main>

</body></html>
