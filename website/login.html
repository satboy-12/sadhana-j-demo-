<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"></head><body class="bg-background font-body-md text-on-background"><main class="w-full bg-background min-h-screen flex items-center justify-center p-gutter"><div class="flex flex-col w-full items-center justify-center min-h-[80vh] px-gutter">
<!-- Decorative background elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none flex items-center justify-center">
<div class="w-[600px] h-[600px] rounded-full bg-gradient-to-br from-primary-fixed/20 via-secondary-fixed/10 to-transparent blur-3xl opacity-75"></div>
</div>
<div class="relative z-10 w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-xl p-space-2xl flex flex-col gap-space-xl">
<!-- Header Branding -->
<div class="flex flex-col items-center text-center gap-space-sm">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center text-on-primary shadow-sm mb-2"><img src="/assets/brand/her-health-journey-logo.png" alt="Her Health Journey Logo" class="w-full h-full object-cover rounded-xl"></div>
<span class="font-label-sm text-surface-tint tracking-widest uppercase">Her Health Journey</span>
<h1 class="font-headline-lg text-on-background">Welcome back</h1>
<p class="font-body-md text-on-surface-variant">Please sign in to access your personal wellness portal and care timeline.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-space-lg" id="loginForm" novalidate="">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-body-sm text-on-background font-medium" for="email">Email address</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-[20px]">mail</span>
<input class="w-full bg-surface-container-low pl-11 pr-4 py-3 rounded-xl font-body-md text-on-background outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 focus:border-primary" id="email" placeholder="name@example.com" required="" type="email">
</div>
<span class="font-label-sm text-error hidden mt-1" id="emailError">Please enter a valid email address.</span>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-body-sm text-on-background font-medium" for="password">Password</label>
<a class="font-label-sm text-surface-tint hover:underline" href="register.html">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-[20px]">lock</span>
<input class="w-full bg-surface-container-low pl-11 pr-12 py-3 rounded-xl font-body-md text-on-background outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 focus:border-primary" id="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-background transition-colors flex items-center justify-center p-1" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<span class="font-label-sm text-error hidden mt-1" id="passwordError">Password must be at least 8 characters.</span>
</div>
<!-- Remember Me & Actions -->
<div class="flex items-center justify-between py-1">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary/40 accent-primary cursor-pointer" id="rememberMe" type="checkbox">
<span class="font-body-sm text-on-surface-variant">Remember me</span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#B66F86] hover:bg-primary text-on-primary font-label-md py-3.5 px-space-md rounded-xl transition-all duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-space-sm" type="button" onclick="window.location.href='dashboard.html'">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Registration Link -->
<div class="text-center pt-space-sm border-t border-surface-container-high/60 flex items-center justify-center gap-1">
<span class="font-body-sm text-on-surface-variant">Don't have an account?</span>
<a class="font-label-md text-surface-tint hover:underline font-semibold" href="register.html">Create account</a>
</div>
</div>
<!-- Interactive Validation & Toggle Script -->
<script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });

    // Form submission validation feedback state demo
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      let isValid = true;

      if (!emailInput.value || !emailInput.value.includes('@')) {
        emailError.classList.remove('hidden');
        emailInput.classList.add('border-error', 'bg-error-container/20');
        isValid = false;
      } else {
        emailError.classList.add('hidden');
        emailInput.classList.remove('border-error', 'bg-error-container/20');
      }

      if (!passwordInput.value || passwordInput.value.length < 8) {
        passwordError.classList.remove('hidden');
        passwordInput.classList.add('border-error', 'bg-error-container/20');
        isValid = false;
      } else {
        passwordError.classList.add('hidden');
        passwordInput.classList.remove('border-error', 'bg-error-container/20');
      }

      if (isValid) {
        // Simulate successful sign in transition
        const submitBtn = loginForm.querySelector('button[type="button" onclick="window.location.href='dashboard.html'"]');
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Signing in...</span>';
        submitBtn.disabled = true;
        setTimeout(() => {
          alert('Successfully signed in to Her Health Journey!');
          submitBtn.innerHTML = '<span>Sign In</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
          submitBtn.disabled = false;
        }, 1200);
      }
    });

    // Clear errors on input
    emailInput.addEventListener('input', () => {
      emailError.classList.add('hidden');
      emailInput.classList.remove('border-error', 'bg-error-container/20');
    });

    passwordInput.addEventListener('input', () => {
      passwordError.classList.add('hidden');
      passwordInput.classList.remove('border-error', 'bg-error-container/20');
    });
  </script>
</div></main>

</body></html>
